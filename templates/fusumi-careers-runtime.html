<div aria-hidden="true" hidden="hidden" id="fusumi-careers-runtime"></div>

<script>
(function(){
  'use strict';

  var PREFIXES=['PB:','ĐĐ:','HT:'];
  var META_PREFIX=/^(địa điểm|hình thức|thu nhập|số lượng|hạn ứng tuyển|mức lương|thời gian làm việc|kinh nghiệm|giới tính)\s*:/i;
  var ORG_NAME='Fusumi Việt Nam';
  var ORG_URL='https://fusumi.vn/';
  var ORG_LOGO='https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiimupQJknfAFKHdclxSQMVT3IUteE7bUJakNoQr3u0avoCImlzzIQ6KIwjbMnahVs_zbOJ7JdwoYrHCxslahCGh2GDn_UTkOPbuNyuS4kkE-QWqgczvjBxc1yar5BUMkK9YRZO0N0THowyPKrckvTKYLkbBWECt_Lzo6KcR2MVUc7gJXE2Yj2kOd9EaZc/s150/Fusumi_Logo.png';

  function normalize(text){return (text||'').replace(/\s+/g,' ').trim();}
  function stripPrefix(raw){raw=normalize(raw);for(var i=0;i<PREFIXES.length;i++){if(raw.indexOf(PREFIXES[i])===0)return raw.slice(PREFIXES[i].length).trim();}return raw;}
  function shorten(text,max){text=normalize(text);if(text.length<=max)return text;return text.slice(0,max-3).replace(/\s+\S*$/,'').trim()+'...';}
  function cleanJobTitle(title){return normalize(title).replace(/^\[[^\]]+\]\s*/,'').replace(/\s*-\s*Khu vực\s+.+$/i,'');}

  function naturalSnippet(doc){
    var body=doc.querySelector('.post-body');if(!body)return '';
    var paragraphs=[].slice.call(body.querySelectorAll('p'));
    for(var i=0;i<paragraphs.length;i++){var text=normalize(paragraphs[i].textContent);if(text.length>=45&&!META_PREFIX.test(text))return shorten(text,180);}
    var blocks=[].slice.call(body.querySelectorAll('div,li'));
    for(var j=0;j<blocks.length;j++){var fallback=normalize(blocks[j].textContent);if(fallback.length>=60&&!META_PREFIX.test(fallback))return shorten(fallback,180);}
    var all=normalize(body.textContent)
      .replace(/Địa điểm\s*:[^:]{0,100}(?=(Hình thức|Thu nhập|Số lượng|Hạn ứng tuyển|$))/ig,' ')
      .replace(/Hình thức\s*:[^:]{0,100}(?=(Thu nhập|Số lượng|Hạn ứng tuyển|$))/ig,' ')
      .replace(/Thu nhập\s*:[^:]{0,140}(?=(Số lượng|Hạn ứng tuyển|$))/ig,' ')
      .replace(/Số lượng\s*:[^:]{0,60}(?=(Hạn ứng tuyển|$))/ig,' ')
      .replace(/Hạn ứng tuyển\s*:[^:]{0,100}/ig,' ');
    return shorten(all,180);
  }

  function addFilterOption(selectId,value){if(!value)return;var select=document.getElementById(selectId);if(!select)return;var exists=[].slice.call(select.options).some(function(option){return option.value===value;});if(exists)return;var option=document.createElement('option');option.value=value;option.textContent=value;select.appendChild(option);}
  function syncChipFilters(chip){var raw=chip.getAttribute('data-raw')||'';if(raw.indexOf('PB:')===0)addFilterOption('departmentFilter',raw.slice(3).trim());if(raw.indexOf('ĐĐ:')===0)addFilterOption('locationFilter',raw.slice(3).trim());if(raw.indexOf('HT:')===0)addFilterOption('typeFilter',raw.slice(3).trim());}
  function needsHydration(job){var title=job.querySelector('h3'),snippet=job.querySelector('.job-inner > p'),chips=job.querySelector('.chips'),text=snippet?normalize(snippet.textContent):'';return !title||!normalize(title.textContent)||!chips||!normalize(chips.textContent)||!snippet||!text||META_PREFIX.test(text)||/(Địa điểm|Hình thức|Thu nhập|Số lượng|Hạn ứng tuyển)\s*:/i.test(text);}

  function hydrateJobCard(job){
    if(!job.querySelector('.job-thumb'))job.classList.add('job-no-image');
    if(!needsHydration(job))return Promise.resolve();
    var title=job.querySelector('h3'),snippet=job.querySelector('.job-inner > p'),chips=job.querySelector('.chips'),more=job.querySelector('.job-more');
    if(!title||!snippet||!chips||!more)return Promise.resolve();
    return fetch(more.href,{credentials:'same-origin'}).then(function(response){if(!response.ok)throw new Error('HTTP '+response.status);return response.text();}).then(function(page){
      var doc=new DOMParser().parseFromString(page,'text/html');
      if(!normalize(title.textContent)){var sourceTitle=doc.querySelector('.content h1'),targetLink=title.querySelector('a');if(sourceTitle&&targetLink)targetLink.textContent=normalize(sourceTitle.textContent);}
      if(!normalize(chips.textContent)){var sourceChips=doc.querySelector('.content .chips');if(sourceChips){chips.innerHTML='';[].slice.call(sourceChips.querySelectorAll('.chip')).forEach(function(sourceChip){var raw=normalize(sourceChip.getAttribute('data-raw')||sourceChip.textContent);if(!raw)return;var chip=document.createElement('span');chip.className='chip';chip.setAttribute('data-raw',raw);chip.textContent=stripPrefix(raw);chips.appendChild(chip);syncChipFilters(chip);});}}
      var clean=naturalSnippet(doc);snippet.textContent=clean||shorten(snippet.textContent,180);
    }).catch(function(error){snippet.textContent=shorten(snippet.textContent,180);if(window.console&&console.warn)console.warn('Fusumi job-card fallback:',error);});
  }

  function hydrateListing(){var jobs=[].slice.call(document.querySelectorAll('.job'));if(!jobs.length)return Promise.resolve();return Promise.all(jobs.map(hydrateJobCard)).then(function(){var search=document.getElementById('jobSearch');if(search)setTimeout(function(){search.dispatchEvent(new Event('input',{bubbles:true}));},0);});}
  function getRawLabels(scope){var result=[];[].slice.call(scope.querySelectorAll('.chip')).forEach(function(chip){var raw=normalize(chip.getAttribute('data-raw')||chip.textContent);if(raw)result.push(raw);});return result;}
  function labelValue(labels,prefix){for(var i=0;i<labels.length;i++){if(labels[i].indexOf(prefix)===0)return labels[i].slice(prefix.length).trim();}return '';}
  function employmentType(value){var key=normalize(value).toLowerCase();var map={'full-time':'FULL_TIME','full time':'FULL_TIME','toàn thời gian':'FULL_TIME','part-time':'PART_TIME','part time':'PART_TIME','bán thời gian':'PART_TIME','contract':'CONTRACTOR','contractor':'CONTRACTOR','hợp đồng':'CONTRACTOR','temporary':'TEMPORARY','thời vụ':'TEMPORARY','intern':'INTERN','internship':'INTERN','thực tập':'INTERN'};return map[key]||value||'';}
  function jobLocation(value){value=normalize(value);if(!value)return null;var address={'@type':'PostalAddress','addressCountry':'VN'};if(/hà nội/i.test(value)){address.addressLocality='Hà Nội';address.addressRegion='Hà Nội';}else address.addressRegion=value;return {'@type':'Place','address':address};}

  function validThroughFromText(text){text=normalize(text);var match=text.match(/Hạn ứng tuyển\s*:\s*(\d{4}-\d{1,2}-\d{1,2}|\d{1,2}[\/.-]\d{1,2}[\/.-]\d{4})/i);if(!match)return '';var raw=match[1],y,m,d;if(/^\d{4}-/.test(raw)){var iso=raw.split('-');y=iso[0];m=iso[1];d=iso[2];}else{var parts=raw.split(/[\/.-]/);d=parts[0];m=parts[1];y=parts[2];}m=('0'+m).slice(-2);d=('0'+d).slice(-2);return y+'-'+m+'-'+d+'T23:59:59+07:00';}
  function tableValue(body,label){if(!body)return '';var rows=[].slice.call(body.querySelectorAll('tr')),wanted=normalize(label).toLowerCase();for(var i=0;i<rows.length;i++){var cells=rows[i].querySelectorAll('th,td');if(cells.length<2)continue;var key=normalize(cells[0].textContent).toLowerCase();if(key===wanted||key.indexOf(wanted)===0)return normalize(cells[1].textContent).replace(/^\[|\]$/g,'').trim();}return '';}

  function sanitizeDescription(body){
    if(!body)return '';var clone=body.cloneNode(true);
    [].slice.call(clone.querySelectorAll('style,script,noscript,iframe,svg,form,button,img')).forEach(function(node){node.remove();});
    [].slice.call(clone.querySelectorAll('table')).forEach(function(table){var frag=document.createDocumentFragment();[].slice.call(table.querySelectorAll('tr')).forEach(function(row){var cells=row.querySelectorAll('th,td');if(cells.length<2)return;var key=normalize(cells[0].textContent),value=normalize(cells[1].textContent);if(!key&&!value)return;var p=document.createElement('p');p.textContent=(key?key+': ':'')+value;frag.appendChild(p);});table.parentNode.insertBefore(frag,table);table.remove();});
    [].slice.call(clone.querySelectorAll('h1,h2,h3,h4,h5,h6')).forEach(function(node){var p=document.createElement('p');p.textContent=normalize(node.textContent);node.parentNode.replaceChild(p,node);});
    [].slice.call(clone.querySelectorAll('a,strong,b,em,i,span')).forEach(function(node){node.parentNode.replaceChild(document.createTextNode(node.textContent||''),node);});
    [].slice.call(clone.querySelectorAll('article,header,section,div')).forEach(function(node){var parent=node.parentNode;while(node.firstChild)parent.insertBefore(node.firstChild,node);node.remove();});
    return clone.innerHTML.trim();
  }

  function validThroughFromBody(body){var fromTable=tableValue(body,'Hạn ứng tuyển');var source=fromTable?('Hạn ứng tuyển: '+fromTable):normalize(body&&body.textContent);return validThroughFromText(source);}
  function totalOpeningsFromBody(body){var fromTable=tableValue(body,'Số lượng');var source=fromTable?fromTable:normalize(body&&body.textContent);var match=source.match(/(\d+)/);if(!match)return null;var n=parseInt(match[1],10);return n>0?n:null;}
  function currentCanonical(){var link=document.querySelector('link[rel="canonical"]');return link?link.href:location.href.split('#')[0];}
  function normalizeUrl(url){try{var parsed=new URL(url,location.origin);return parsed.origin+parsed.pathname.replace(/\/$/,'');}catch(error){return url;}}

  function bloggerPostMeta(canonical){return fetch('/feeds/posts/default?alt=json&max-results=500',{credentials:'same-origin'}).then(function(response){if(!response.ok)throw new Error('Blogger feed HTTP '+response.status);return response.json();}).then(function(feed){var entries=(feed.feed&&feed.feed.entry)||[],wanted=normalizeUrl(canonical);for(var i=0;i<entries.length;i++){var links=entries[i].link||[];for(var j=0;j<links.length;j++){if(links[j].rel==='alternate'&&normalizeUrl(links[j].href)===wanted)return {id:entries[i].id&&entries[i].id.$t||canonical,published:entries[i].published&&entries[i].published.$t||'',updated:entries[i].updated&&entries[i].updated.$t||''};}}return null;});}

  function injectJobPosting(){
    var scope=document.querySelector('.content[itemtype*="JobPosting"]');if(!scope)return Promise.resolve();
    var h1=scope.querySelector('h1'),body=scope.querySelector('.post-body');if(!h1||!body)return Promise.resolve();
    var schemaTitle=cleanJobTitle(h1.textContent),description=sanitizeDescription(body);if(!schemaTitle||!description)return Promise.resolve();
    var labels=getRawLabels(scope),type=employmentType(labelValue(labels,'HT:')),locationValue=labelValue(labels,'ĐĐ:'),bodyText=normalize(body.textContent),canonical=currentCanonical();
    return bloggerPostMeta(canonical).then(function(meta){
      if(!meta||!meta.published){if(window.console&&console.warn)console.warn('Fusumi JobPosting: missing Blogger datePosted; JSON-LD not emitted.');return;}
      var data={'@context':'https://schema.org','@type':'JobPosting','title':schemaTitle,'description':description,'datePosted':meta.published.slice(0,10),'identifier':{'@type':'PropertyValue','name':ORG_NAME,'value':meta.id},'hiringOrganization':{'@type':'Organization','name':ORG_NAME,'sameAs':ORG_URL,'logo':ORG_LOGO},'url':canonical,'directApply':false};
      var expires=validThroughFromBody(body),loc=jobLocation(locationValue),openings=totalOpeningsFromBody(body);if(expires)data.validThrough=expires;if(type)data.employmentType=type;if(loc)data.jobLocation=loc;if(openings)data.totalJobOpenings=openings;
      var old=document.getElementById('fusumi-jobposting-jsonld');if(old)old.remove();var script=document.createElement('script');script.id='fusumi-jobposting-jsonld';script.type='application/ld+json';script.text=JSON.stringify(data);document.head.appendChild(script);
      if(!document.querySelector('meta[name="description"]')){var metaDescription=document.createElement('meta');metaDescription.name='description';metaDescription.content=naturalSnippet(document)||shorten(bodyText,155);document.head.appendChild(metaDescription);}
    }).catch(function(error){if(window.console&&console.warn)console.warn('Fusumi JobPosting:',error);});
  }

  function enhanceListingUX(){
    var count=document.getElementById('jobCount'),empty=document.getElementById('jobsEmpty'),clear=document.getElementById('clearFilters'),search=document.getElementById('jobSearch'),selects=[document.getElementById('departmentFilter'),document.getElementById('locationFilter'),document.getElementById('typeFilter')].filter(Boolean);
    if(count)count.setAttribute('aria-live','polite');if(empty){empty.setAttribute('role','status');empty.setAttribute('aria-live','polite');}
    function hasActiveFilters(){if(search&&normalize(search.value))return true;return selects.some(function(select){return !!select.value;});}
    function syncClear(){if(!clear)return;var active=hasActiveFilters();clear.disabled=!active;clear.setAttribute('aria-disabled',active?'false':'true');clear.classList.toggle('is-disabled',!active);}
    if(search){search.setAttribute('autocomplete','off');search.addEventListener('keydown',function(event){if(event.key==='Escape'&&search.value){search.value='';search.dispatchEvent(new Event('input',{bubbles:true}));syncClear();}});search.addEventListener('input',syncClear);}
    selects.forEach(function(select){select.addEventListener('change',syncClear);});if(clear)clear.addEventListener('click',function(){setTimeout(syncClear,0);});if(count)new MutationObserver(syncClear).observe(count,{childList:true,subtree:true,characterData:true});syncClear();
  }

  function enhanceApplyLinks(){
    var scope=document.querySelector('.content[itemtype*="JobPosting"]');if(!scope)return;
    var h1=scope.querySelector('h1'),title=cleanJobTitle(h1&&h1.textContent||''),canonical=currentCanonical();if(!title)return;
    [].slice.call(scope.querySelectorAll('.apply a,.job-cta a')).forEach(function(link){var url=new URL('/p/ung-tuyen.html',location.origin);url.searchParams.set('vi-tri',title);url.searchParams.set('job',canonical);link.href=url.pathname+url.search;});
  }

  function enhanceApplyPage(){
    var page=document.querySelector('.fusumi-apply-page');if(!page)return;
    var params=new URLSearchParams(location.search),position=normalize(params.get('vi-tri')||''),jobUrl=normalize(params.get('job')||''),display=page.querySelector('[data-apply-position]'),mail=page.querySelector('[data-apply-email]'),jobLink=page.querySelector('[data-apply-job-link]');
    if(display)display.textContent=position||'Vị trí phù hợp tại Fusumi';
    if(jobLink){if(jobUrl){jobLink.href=jobUrl;jobLink.hidden=false;}else jobLink.hidden=true;}
    if(mail){var subject='Ứng tuyển - '+(position||'Fusumi');var lines=['Kính gửi Bộ phận Tuyển dụng Fusumi,','','Tôi gửi hồ sơ ứng tuyển cho vị trí: '+(position||'................................'),jobUrl?'Tin tuyển dụng: '+jobUrl:'','','Họ và tên:','Số điện thoại:','Link CV/Portfolio:','','Trân trọng.'].filter(Boolean);mail.href='mailto:hr@fusumi.vn?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(lines.join('\n'));}
  }

  function boot(){hydrateListing();enhanceListingUX();enhanceApplyLinks();enhanceApplyPage();injectJobPosting();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
