name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-theme:
    name: validate-theme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Blogger theme
        run: python scripts/validate_theme.py

      - name: Validate Blogger runtime contracts
        run: python scripts/check_runtime_contract.py

      - name: Validate repository files
        shell: bash
        run: |
          test -f README.md
          test -f docs/cai-dat-blogger.md
          test -f templates/mau-tin-tuyen-dung.md
          test -f templates/footer-contact.html
          test -f templates/fusumi-careers-runtime.html
          test -f templates/pages/ve-fusumi.html
          test -f templates/pages/quy-trinh-tuyen-dung.html
          test -f templates/pages/ung-tuyen.html
          test -f blogger/fusumi-careers-custom.css
          test -f scripts/validate_theme.py
          test -f scripts/check_live_site.py
          test -f scripts/check_runtime_contract.py
          test -f tests/runtime.spec.js
          ! grep -RInE '^(<<<<<<<|=======|>>>>>>>)' . --exclude-dir=.git

      - name: Compile Python scripts
        run: python -m py_compile scripts/validate_theme.py scripts/check_live_site.py scripts/check_runtime_contract.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser runtime contracts
        run: npx playwright test tests/runtime.spec.js --reporter=line --workers=1

      - name: Upload validated theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: fusumi-careers-theme
          path: blogger/fusumi-careers-theme.xml
          if-no-files-found: error
