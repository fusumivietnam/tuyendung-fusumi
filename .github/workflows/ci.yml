name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-theme:
    name: validate-theme
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_VERSION: '1.63.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Blogger theme
        run: python scripts/validate_theme.py

      - name: Validate Blogger runtime contracts
        run: python scripts/check_runtime_contract.py

      - name: Validate job template contract
        run: python scripts/check_job_template.py

      - name: Test Python QA and live probe
        run: python -m unittest tests/test_job_authoring_qa.py tests/test_live_site_probe.py tests/test_playwright_cache_contract.py tests/test_production_job_fixes.py tests/test_recruitment_funnel.py

      - name: Validate repository files
        shell: bash
        run: |
          test -f README.md
          test -f docs/cai-dat-blogger.md
          test -f docs/job-authoring-qa.md
          test -f docs/live-authoring-audit.md
          test -f docs/production-job-remediation-62.md
          test -f templates/mau-tin-tuyen-dung.md
          test -f templates/mau-tin-tuyen-dung-blogger.html
          test -f templates/footer-contact.html
          test -f templates/fusumi-careers-config.html
          test -f templates/fusumi-careers-runtime.html
          test -f templates/fusumi-analytics-runtime.html
          test -f templates/pages/ve-fusumi.html
          test -f templates/pages/quy-trinh-tuyen-dung.html
          test -f templates/pages/ung-tuyen.html
          test -f production-fixes/issue-62/ke-toan-noi-bo.html
          test -f production-fixes/issue-62/nvkd-mien-trung.html
          test -f blogger/fusumi-careers-custom.css
          test -f scripts/report_recruitment_funnel.py
          test -f tests/test_recruitment_funnel.py
          test -f docs/recruitment-funnel-report.md
          test -f scripts/validate_theme.py
          test -f scripts/check_live_site.py
          test -f scripts/check_live_authoring.mjs
          test -f scripts/check_live_runtime.mjs
          test -f scripts/live_jobs.mjs
          test -f scripts/render_live_summary.mjs
          test -f scripts/sync_live_failure_issue.mjs
          test -f scripts/check_runtime_contract.py
          test -f scripts/check_job_template.py
          test -f scripts/check_job_authoring.py
          test -f tests/test_job_authoring_qa.py
          test -f tests/test_live_site_probe.py
          test -f tests/test_playwright_cache_contract.py
          test -f tests/test_production_job_fixes.py
          test -f tests/test_live_jobs.mjs
          test -f tests/test_live_summary.mjs
          test -f tests/test_live_failure_issue.mjs
          test -f tests/runtime.spec.js
          test -f tests/analytics-runtime.spec.js
          test -f tests/apply-hardening.spec.js
          test -f tests/layout-config.spec.js
          test -f tests/job-lifecycle.spec.js
          ! grep -RInE '^(<<<<<<<|=======|>>>>>>>)' . --exclude-dir=.git

      - name: Compile Python scripts
        run: python -m py_compile scripts/validate_theme.py scripts/check_live_site.py scripts/check_runtime_contract.py scripts/check_job_template.py scripts/check_job_authoring.py scripts/report_recruitment_funnel.py tests/test_recruitment_funnel.py tests/test_job_authoring_qa.py tests/test_live_site_probe.py tests/test_playwright_cache_contract.py tests/test_production_job_fixes.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate Node scripts
        run: |
          node --check scripts/live_jobs.mjs
          node --check scripts/check_live_authoring.mjs
          node --check scripts/check_live_runtime.mjs
          node --check scripts/render_live_summary.mjs
          node --check scripts/sync_live_failure_issue.mjs
          node tests/test_live_jobs.mjs
          node tests/test_live_summary.mjs
          node tests/test_live_failure_issue.mjs

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@${PLAYWRIGHT_VERSION}

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Install Chromium browser on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run browser runtime contracts
        run: npx playwright test tests/runtime.spec.js tests/analytics-runtime.spec.js tests/apply-hardening.spec.js tests/layout-config.spec.js tests/job-lifecycle.spec.js --reporter=line --workers=1

      - name: Upload validated theme artifact
        uses: actions/upload-artifact@v7
        with:
          name: fusumi-careers-theme
          path: blogger/fusumi-careers-theme.xml
          if-no-files-found: error
