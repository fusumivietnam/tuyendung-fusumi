name: Live Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 08:00 Asia/Ho_Chi_Minh
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  smoke-test:
    name: live-smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runtime source contracts
        run: python scripts/check_runtime_contract.py

      - name: Check deployed Blogger HTML
        run: python scripts/check_live_site.py --site https://tuyendung.fusumi.vn/ --min-jobs 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify rendered production runtime
        run: node scripts/check_live_runtime.mjs

      - name: Upload live runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-runtime-report
          path: live-runtime-report.json
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo '## Fusumi Careers live smoke test' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Site: https://tuyendung.fusumi.vn/' >> "$GITHUB_STEP_SUMMARY"
          echo '- Triggers: main update, manual dispatch, and daily at 08:00 Asia/Ho_Chi_Minh.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Static checks: homepage, Page links, canonical URLs, job cards, runtime marker, one job detail, and Apply route.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Rendered checks: both published jobs, Careers/Analytics/Config markers, canonical, job-specific meta description, Apply parameters, GA4 loader, and JobPosting JSON-LD.' >> "$GITHUB_STEP_SUMMARY"
          echo '- JobPosting guardrails: directApply=false, clean URL, required core fields, no fabricated baseSalary, and valid validThrough when present.' >> "$GITHUB_STEP_SUMMARY"
          echo '- HTTP 429 from Blogger or its feed is reported as inconclusive where possible instead of a false production regression.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f live-runtime-report.json ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat live-runtime-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
