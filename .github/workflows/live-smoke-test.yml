name: Live Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  smoke-test:
    name: live-smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployed Blogger site
        run: python scripts/check_live_site.py --site https://tuyendung.fusumi.vn/ --min-jobs 1

      - name: Summary
        if: always()
        run: |
          echo 'Site: https://tuyendung.fusumi.vn/' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checks: homepage, search, static pages, job cards, one discovered job Post, JobPosting marker.' >> "$GITHUB_STEP_SUMMARY"
