name: Live Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 08:00 Asia/Ho_Chi_Minh
    - cron: '0 1 * * *'

permissions:
  contents: read
  issues: write

jobs:
  smoke-test:
    name: live-smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runtime source contracts
        run: python scripts/check_runtime_contract.py

      - name: Check deployed Blogger HTML
        run: python scripts/check_live_site.py --site https://tuyendung.fusumi.vn/ --min-jobs 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit live job authoring contract
        run: node scripts/check_live_authoring.mjs

      - name: Verify rendered production runtime
        if: always()
        run: node scripts/check_live_runtime.mjs

      - name: Upload live authoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-authoring-report
          path: live-authoring-report.json
          if-no-files-found: ignore

      - name: Upload live runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-runtime-report
          path: live-runtime-report.json
          if-no-files-found: ignore

      - name: Live status dashboard
        if: always()
        run: node scripts/render_live_summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Sync production regression issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync_live_failure_issue.mjs
