name: Live Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 08:00 Asia/Ho_Chi_Minh
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  smoke-test:
    name: live-smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runtime source contracts
        run: python scripts/check_runtime_contract.py

      - name: Check deployed Blogger site
        run: python scripts/check_live_site.py --site https://tuyendung.fusumi.vn/ --min-jobs 1

      - name: Summary
        if: always()
        run: |
          echo '## Fusumi Careers live smoke test' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Site: https://tuyendung.fusumi.vn/' >> "$GITHUB_STEP_SUMMARY"
          echo '- Triggers: main update, manual dispatch, and daily at 08:00 Asia/Ho_Chi_Minh.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Source contracts: centralized CSS, HTML-only Footer, runtime apply/JobPosting hooks, Page hooks.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Live checks when Blogger accepts the runner: homepage, Page links, canonical URLs, job cards, runtime marker, one job detail, and the apply route.' >> "$GITHUB_STEP_SUMMARY"
          echo '- HTTP 429 after all retries is reported as inconclusive, not as a site regression, because Blogger can rate-limit GitHub-hosted runner IPs.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Client-side runtime behavior and JSON-LD execution are covered by the Playwright browser contracts in CI.' >> "$GITHUB_STEP_SUMMARY"
