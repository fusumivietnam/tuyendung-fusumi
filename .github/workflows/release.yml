name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Blogger theme XML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path('blogger/fusumi-careers-theme.xml')
          if not path.exists():
              raise SystemExit('Missing Blogger theme')

          text = path.read_text(encoding='utf-8')
          if any(marker in text for marker in ('<<<<<<<', '=======', '>>>>>>>')):
              raise SystemExit('Merge conflict marker found in theme')

          ET.parse(path)
          print('Theme XML validation passed.')
          PY

      - name: Package validated theme
        uses: actions/upload-artifact@v4
        with:
          name: fusumi-careers-release-candidate
          path: blogger/fusumi-careers-theme.xml
          if-no-files-found: error

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'Release dry-run passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Theme XML was validated and packaged as an Actions artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No GitHub Release was created because this run was started manually.' >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            blogger/fusumi-careers-theme.xml \
            --title "Fusumi Careers ${GITHUB_REF_NAME}" \
            --generate-notes
