name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Blogger theme
        run: python scripts/validate_theme.py

      - name: Build release checksum
        shell: bash
        run: sha256sum blogger/fusumi-careers-theme.xml > blogger/fusumi-careers-theme.xml.sha256

      - name: Package validated theme
        uses: actions/upload-artifact@v4
        with:
          name: fusumi-careers-release-candidate
          path: |
            blogger/fusumi-careers-theme.xml
            blogger/fusumi-careers-theme.xml.sha256
          if-no-files-found: error

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'Release dry-run passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Theme XML was validated and packaged with SHA-256 checksum.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No GitHub Release was created because this run was started manually.' >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            blogger/fusumi-careers-theme.xml \
            blogger/fusumi-careers-theme.xml.sha256 \
            --title "Fusumi Careers ${GITHUB_REF_NAME}" \
            --generate-notes
